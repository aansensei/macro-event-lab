<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" width="720" height="340" fill="none">
  <title>Building a 90 percent interval from past errors</title>
  <desc>Two step diagram showing 40 sorted abstract forecast error bars with the 37th bar highlighted, and that same distance applied symmetrically above and below a point forecast to form a 90 percent interval.</desc>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #111822;
      --surface-hover: #172130;
      --border: #1e293b;
      --border-control: #64748b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #00d2ee;
      --accent-tint: rgba(0, 210, 238, 0.12);
      --ghost: #64748b;
      --surprise-up: #fb923c;
      --surprise-down: #f472b6;
      --band-90: rgba(0, 210, 238, 0.12);
      --band-50: rgba(0, 210, 238, 0.26);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f3f8fb;
        --surface-hover: #e8f1f7;
        --border: #dbe7ef;
        --border-control: #6f8799;
        --text: #062033;
        --text-muted: #3f5b6e;
        --accent: #0369a1;
        --accent-tint: rgba(3, 105, 161, 0.08);
        --ghost: #6f8799;
        --surprise-up: #c2410c;
        --surprise-down: #be185d;
        --band-90: rgba(3, 105, 161, 0.09);
        --band-50: rgba(3, 105, 161, 0.22);
      }
    }
    text { font-family: Inter, system-ui, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .title { font-size: 16px; font-weight: 600; fill: var(--text); }
    .subtitle { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .label { font-size: 13px; font-weight: 600; fill: var(--text); }
    .label-accent { font-size: 13px; font-weight: 600; fill: var(--accent); }
    .label-up { font-size: 13px; font-weight: 600; fill: var(--surprise-up); }
    .label-down { font-size: 13px; font-weight: 600; fill: var(--surprise-down); }
    .small { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .small-strong { font-size: 12px; font-weight: 600; fill: var(--text); }
    .small-accent { font-size: 12px; font-weight: 600; fill: var(--accent); }
  </style>
  <rect x="0" y="0" width="720" height="340" fill="var(--bg)"/>
  <text x="28" y="34" class="title">Building a 90 percent interval from past errors</text>
  <text x="28" y="54" class="subtitle">The last 40 absolute errors are sorted. The 37th error sets the symmetric half width.</text>

  <rect x="28" y="74" width="402" height="218" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="44" y="98" class="label">Step 1: sort last 40 absolute errors</text>

  <line x1="46" y1="240" x2="414" y2="240" stroke="var(--border-control)" stroke-width="1.5"/>
  <rect x="50" y="234.0" width="5" height="6.0" rx="1.5" fill="var(--border-control)"/>
  <rect x="59" y="233.3" width="5" height="6.7" rx="1.5" fill="var(--border-control)"/>
  <rect x="68" y="232.6" width="5" height="7.4" rx="1.5" fill="var(--border-control)"/>
  <rect x="77" y="231.9" width="5" height="8.1" rx="1.5" fill="var(--border-control)"/>
  <rect x="86" y="231.2" width="5" height="8.8" rx="1.5" fill="var(--border-control)"/>
  <rect x="95" y="230.4" width="5" height="9.6" rx="1.5" fill="var(--border-control)"/>
  <rect x="104" y="229.6" width="5" height="10.4" rx="1.5" fill="var(--border-control)"/>
  <rect x="113" y="228.8" width="5" height="11.2" rx="1.5" fill="var(--border-control)"/>
  <rect x="122" y="227.9" width="5" height="12.1" rx="1.5" fill="var(--border-control)"/>
  <rect x="131" y="226.9" width="5" height="13.1" rx="1.5" fill="var(--border-control)"/>
  <rect x="140" y="225.9" width="5" height="14.1" rx="1.5" fill="var(--border-control)"/>
  <rect x="149" y="224.9" width="5" height="15.1" rx="1.5" fill="var(--border-control)"/>
  <rect x="158" y="223.8" width="5" height="16.2" rx="1.5" fill="var(--border-control)"/>
  <rect x="167" y="222.6" width="5" height="17.4" rx="1.5" fill="var(--border-control)"/>
  <rect x="176" y="221.4" width="5" height="18.6" rx="1.5" fill="var(--border-control)"/>
  <rect x="185" y="220.1" width="5" height="19.9" rx="1.5" fill="var(--border-control)"/>
  <rect x="194" y="218.8" width="5" height="21.2" rx="1.5" fill="var(--border-control)"/>
  <rect x="203" y="217.4" width="5" height="22.6" rx="1.5" fill="var(--border-control)"/>
  <rect x="212" y="215.9" width="5" height="24.1" rx="1.5" fill="var(--border-control)"/>
  <rect x="221" y="214.4" width="5" height="25.6" rx="1.5" fill="var(--border-control)"/>
  <rect x="230" y="212.8" width="5" height="27.2" rx="1.5" fill="var(--border-control)"/>
  <rect x="239" y="211.1" width="5" height="28.9" rx="1.5" fill="var(--border-control)"/>
  <rect x="248" y="209.3" width="5" height="30.7" rx="1.5" fill="var(--border-control)"/>
  <rect x="257" y="207.4" width="5" height="32.6" rx="1.5" fill="var(--border-control)"/>
  <rect x="266" y="205.5" width="5" height="34.5" rx="1.5" fill="var(--border-control)"/>
  <rect x="275" y="203.5" width="5" height="36.5" rx="1.5" fill="var(--border-control)"/>
  <rect x="284" y="201.4" width="5" height="38.6" rx="1.5" fill="var(--border-control)"/>
  <rect x="293" y="199.3" width="5" height="40.7" rx="1.5" fill="var(--border-control)"/>
  <rect x="302" y="197.0" width="5" height="43.0" rx="1.5" fill="var(--border-control)"/>
  <rect x="311" y="194.6" width="5" height="45.4" rx="1.5" fill="var(--border-control)"/>
  <rect x="320" y="192.2" width="5" height="47.8" rx="1.5" fill="var(--border-control)"/>
  <rect x="329" y="189.7" width="5" height="50.3" rx="1.5" fill="var(--border-control)"/>
  <rect x="338" y="187.1" width="5" height="52.9" rx="1.5" fill="var(--border-control)"/>
  <rect x="347" y="184.3" width="5" height="55.7" rx="1.5" fill="var(--border-control)"/>
  <rect x="356" y="181.5" width="5" height="58.5" rx="1.5" fill="var(--border-control)"/>
  <rect x="365" y="178.6" width="5" height="61.4" rx="1.5" fill="var(--border-control)"/>
  <rect x="374" y="175.6" width="5" height="64.4" rx="1.5" fill="var(--accent)"/>
  <rect x="383" y="172.5" width="5" height="67.5" rx="1.5" fill="var(--ghost)"/>
  <rect x="392" y="169.3" width="5" height="70.7" rx="1.5" fill="var(--ghost)"/>
  <rect x="401" y="166.0" width="5" height="74.0" rx="1.5" fill="var(--ghost)"/>

  <line x1="376.5" y1="132" x2="376.5" y2="169.6" stroke="var(--accent)" stroke-width="1.5"/>
  <circle cx="376.5" cy="172.6" r="2.5" fill="var(--accent)"/>
  <text x="368" y="138" text-anchor="end" class="small-accent">37th error (half width)</text>

  <text x="50" y="262" class="small">Smallest</text>
  <text x="406" y="262" text-anchor="end" class="small">Largest</text>
  <text x="44" y="280" class="small">Abstract error bars, ordered from lowest to highest</text>

  <line x1="436" y1="186" x2="462" y2="186" stroke="var(--accent)" stroke-width="1.75"/>
  <path d="M456 180 L464 186 L456 192" stroke="var(--accent)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="470" y="74" width="222" height="218" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <text x="486" y="98" class="label">Step 2: draw interval</text>

  <rect x="498" y="121.6" width="72" height="128.8" rx="4" fill="var(--band-90)" stroke="var(--accent)" stroke-width="1.5"/>
  <line x1="498" y1="186" x2="570" y2="186" stroke="var(--accent)" stroke-width="1.75" stroke-dasharray="4 3"/>
  <circle cx="534" cy="186" r="7" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="534" cy="186" r="2.5" fill="var(--accent)"/>

  <line x1="488" y1="121.6" x2="488" y2="183" stroke="var(--border-control)" stroke-width="1.5"/>
  <line x1="484" y1="121.6" x2="492" y2="121.6" stroke="var(--border-control)" stroke-width="1.5"/>
  <line x1="488" y1="189" x2="488" y2="250.4" stroke="var(--border-control)" stroke-width="1.5"/>
  <line x1="484" y1="250.4" x2="492" y2="250.4" stroke="var(--border-control)" stroke-width="1.5"/>

  <text x="582" y="125.6" class="small-strong">Upper bound</text>
  <text x="582" y="155.6" class="small">Half width</text>
  <text x="582" y="190" class="small-accent">Point forecast</text>
  <text x="582" y="226.4" class="small">Half width</text>
  <text x="582" y="254.4" class="small-strong">Lower bound</text>

  <text x="28" y="320" class="small">An error enters calibration only once its own actual value is public. Intervals are symmetric.</text>
</svg>
