<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" fill="none">
  <title>First print and later revisions</title>
  <desc>Diagram showing one economic value published as a first print, then revised upward and downward in two later releases, with only the first print highlighted as scored by the arena.</desc>
  <style>
    :root {
      --bg: #0b0f14;
      --surface: #111822;
      --surface-hover: #172130;
      --border: #1e293b;
      --border-control: #64748b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #00d2ee;
      --accent-tint: rgba(0, 210, 238, 0.12);
      --ghost: #64748b;
      --surprise-up: #fb923c;
      --surprise-down: #f472b6;
      --band-90: rgba(0, 210, 238, 0.12);
      --band-50: rgba(0, 210, 238, 0.26);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f3f8fb;
        --surface-hover: #e8f1f7;
        --border: #dbe7ef;
        --border-control: #6f8799;
        --text: #062033;
        --text-muted: #3f5b6e;
        --accent: #0369a1;
        --accent-tint: rgba(3, 105, 161, 0.08);
        --ghost: #6f8799;
        --surprise-up: #c2410c;
        --surprise-down: #be185d;
        --band-90: rgba(3, 105, 161, 0.09);
        --band-50: rgba(3, 105, 161, 0.22);
      }
    }
    text { font-family: Inter, system-ui, sans-serif; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .title { font-size: 16px; font-weight: 600; fill: var(--text); }
    .subtitle { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .label { font-size: 13px; font-weight: 600; fill: var(--text); }
    .label-accent { font-size: 13px; font-weight: 600; fill: var(--accent); }
    .label-up { font-size: 13px; font-weight: 600; fill: var(--surprise-up); }
    .label-down { font-size: 13px; font-weight: 600; fill: var(--surprise-down); }
    .small { font-size: 12px; font-weight: 400; fill: var(--text-muted); }
    .small-strong { font-size: 12px; font-weight: 600; fill: var(--text); }
    .small-accent { font-size: 12px; font-weight: 600; fill: var(--accent); }
  </style>
  <rect x="0" y="0" width="720" height="320" fill="var(--bg)"/>
  <text x="28" y="34" class="title">First print and later revisions</text>
  <text x="28" y="54" class="subtitle">One reference period is published first and revised twice. The arena scores the first print only.</text>

  <line x1="48" y1="114" x2="684" y2="114" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="48" y1="164" x2="684" y2="164" stroke="var(--border)" stroke-width="1.5"/>
  <line x1="48" y1="214" x2="684" y2="214" stroke="var(--border)" stroke-width="1.5"/>

  <rect x="64" y="76" width="184" height="172" rx="8" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.5"/>
  <text x="156" y="98" text-anchor="middle" class="small-accent">Scored by arena</text>

  <line x1="166" y1="164" x2="660" y2="164" stroke="var(--border-control)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M156 164 L388 124 L600 198" stroke="var(--border-control)" stroke-width="1.75" stroke-dasharray="6 4"/>

  <g>
    <circle cx="156" cy="164" r="10" fill="var(--bg)" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="156" cy="164" r="3.5" fill="var(--accent)"/>
    <text x="156" y="210" text-anchor="middle" class="label">First print</text>
    <text x="156" y="229" text-anchor="middle" class="small">Published first</text>
  </g>

  <g>
    <line x1="388" y1="164" x2="388" y2="136" stroke="var(--surprise-up)" stroke-width="1.75"/>
    <path d="M383 142 L388 134 L393 142" stroke="var(--surprise-up)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="388" cy="124" r="8" fill="var(--bg)" stroke="var(--surprise-up)" stroke-width="2"/>
    <text x="388" y="98" text-anchor="middle" class="label-up">First revision</text>
    <text x="388" y="229" text-anchor="middle" class="small">Revised, not scored</text>
  </g>

  <g>
    <line x1="600" y1="164" x2="600" y2="186" stroke="var(--surprise-down)" stroke-width="1.75"/>
    <path d="M595 180 L600 188 L605 180" stroke="var(--surprise-down)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="600" cy="198" r="8" fill="var(--bg)" stroke="var(--surprise-down)" stroke-width="2"/>
    <text x="600" y="148" text-anchor="middle" class="label-down">Second revision</text>
    <text x="600" y="229" text-anchor="middle" class="small">Revised, not scored</text>
  </g>

  <line x1="48" y1="264" x2="676" y2="264" stroke="var(--border-control)" stroke-width="1.5"/>
  <path d="M670 259 L678 264 L670 269" stroke="var(--border-control)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="284" class="small">One reference period across publication time</text>
  <text x="678" y="284" text-anchor="end" class="small">Later releases</text>
  <text x="28" y="308" class="small">Each target is computed inside one vintage, never mixing values across revisions.</text>
</svg>
