[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macro-event-lab"
version = "0.1.0"
description = "Point-in-time pipeline for market-implied expectations around U.S. macro releases (Kalshi + ALFRED)."
license = { text = "MIT" }
authors = [{ name = "Cao Thien An Nguyen" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # zoneinfo has no system time zone database on Windows
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "scikit-learn>=1.5",
]

[project.scripts]
mel = "macro_event_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
macro_event_lab = ["seeds/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
