name: Public site

# Rebuilds the public edition from ALFRED and FRED every day and publishes it on GitHub Pages.
# The runner never has the Kalshi archive, so no market-derived file can reach the site.
on:
  push:
    branches: [main]
  schedule:
    # 14:30 UTC, after the 08:30 New York releases have reached ALFRED
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      issues: write
    env:
      MEL_DATA_DIR: ${{ github.workspace }}/../mel-data
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e pipeline
      - name: Download ALFRED vintages and release dates, then rebuild
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m macro_event_lab ingest releases
          python -m macro_event_lab ingest alfred
          python -m macro_event_lab ingest spf || echo "Survey download failed; the site is built without it"
          python -m macro_event_lab build-public
      - name: Check source freshness
        id: fresh
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report_file="${RUNNER_TEMP:-/tmp}/freshness_report.txt"
          set +e
          python -m macro_event_lab check-freshness --status "$MEL_DATA_DIR/web_public/status.json" > "$report_file" 2>&1
          status_code=$?
          set -e
          cat "$report_file"
          exit "$status_code"
      - name: Copy only the public files into the site
        run: |
          mkdir -p web/public/data
          cp "$MEL_DATA_DIR/web_public/revisions.json" "$MEL_DATA_DIR/web_public/nowcast.json" "$MEL_DATA_DIR/web_public/status.json" "$MEL_DATA_DIR/web_public/arena.json" "$MEL_DATA_DIR/web_public/briefing.json" "$MEL_DATA_DIR/web_public/calendar.ics" "$MEL_DATA_DIR/web_public/feed.xml" "$MEL_DATA_DIR/web_public/arena_forecasts.parquet" "$MEL_DATA_DIR/web_public/arena_scores.parquet" "$MEL_DATA_DIR/web_public/revisions.parquet" "$MEL_DATA_DIR/web_public/arena_forecasts.csv" "$MEL_DATA_DIR/web_public/arena_scores.csv" "$MEL_DATA_DIR/web_public/revisions.csv" web/public/data/
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_EDITION: public
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - name: Close resolved build issue
        if: success() && steps.fresh.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq '[.[] | select(.title == "Daily build problem")][0].number // ""')"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GH_REPO" --comment "Resolved: the latest build is fresh and complete."
          fi
      - name: Alert on daily build problem
        if: failure() || steps.fresh.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FRESH_OUTCOME: ${{ steps.fresh.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          body="Daily build problem reported in run: $RUN_URL"
          report_file="${RUNNER_TEMP:-/tmp}/freshness_report.txt"
          if [ "$FRESH_OUTCOME" = "failure" ] && [ -s "$report_file" ]; then
            report_text="$(cat "$report_file")"
            body="${body}"$'\n\n'"${report_text}"
          fi
          issue_number="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq '[.[] | select(.title == "Daily build problem")][0].number // ""')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "Daily build problem" --body "$body"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
