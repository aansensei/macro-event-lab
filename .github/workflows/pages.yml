name: Public site

# Rebuilds the public edition from ALFRED and FRED every day and publishes it on GitHub Pages.
# The runner never has the Kalshi archive, so no market-derived file can reach the site.
on:
  push:
    branches: [main]
    paths-ignore: ["ledger/**"]
  schedule:
    # 14:30 UTC, after the 08:30 New York releases have reached ALFRED
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
    env:
      MEL_DATA_DIR: ${{ github.workspace }}/../mel-data
    steps:
      - uses: actions/checkout@v7
      - name: Choose a full rebuild or reuse the published data
        id: mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          SITE: https://aansensei.dev/macro-event-lab
        run: |
          set -uo pipefail
          full=true
          if [ "$EVENT" = "push" ]; then
            changed="$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename' 2>/dev/null || echo FAILED)"
            if [ "$changed" != "FAILED" ] && [ -n "$changed" ] && ! echo "$changed" | grep -qE '^(pipeline/|\.github/|ledger/|Dockerfile)'; then
              mkdir -p web/public/data
              reuse=1
              for name in revisions.json nowcast.json status.json arena.json briefing.json ledger.json calendar.ics feed.xml arena_forecasts.parquet arena_scores.parquet revisions.parquet arena_forecasts.csv arena_scores.csv revisions.csv; do
                if ! curl -fsSL --retry 2 -o "web/public/data/$name" "$SITE/data/$name"; then reuse=0; break; fi
                case "$name" in *.json) jq empty "web/public/data/$name" || { reuse=0; break; } ;; esac
              done
              if [ "$reuse" = 1 ]; then
                full=false
                echo "This push changed only the site, so the published data was reused." >> "$GITHUB_STEP_SUMMARY"
              else
                rm -rf web/public/data
              fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.mode.outputs.full == 'true'
        with:
          python-version: "3.12"
      - run: pip install -e pipeline
        if: steps.mode.outputs.full == 'true'
      - name: Download ALFRED vintages and release dates, then rebuild
        id: ingest
        if: steps.mode.outputs.full == 'true'
        shell: bash
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -euo pipefail
          python -m macro_event_lab ingest releases
          python -m macro_event_lab ingest alfred
          if python -m macro_event_lab ingest spf; then
            echo "spf_failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Survey download failed; the site is built without it"
            echo "spf_failed=true" >> "$GITHUB_OUTPUT"
            echo "Survey download failed in this run; the survey median is stale." >> "$GITHUB_STEP_SUMMARY"
          fi
          python -m macro_event_lab build-public
      - name: Append live forecasts to ledger
        if: steps.mode.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m macro_event_lab ledger-append --arena "$MEL_DATA_DIR/web_public/arena.json" --file ledger/forecast_ledger.jsonl
      - name: Verify and push forecast ledger
        if: steps.mode.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m macro_event_lab verify-ledger --file ledger/forecast_ledger.jsonl
          if [ -z "$(git status --porcelain ledger/forecast_ledger.jsonl)" ]; then
            echo "Ledger unchanged; skipping commit"
            exit 0
          fi
          as_of="$(python -c "import json, os; print(json.load(open(os.path.join(os.environ['MEL_DATA_DIR'], 'web_public', 'arena.json'), encoding='utf-8'))['information_date'])")"
          git config user.name "Macro Event Lab bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/forecast_ledger.jsonl
          git commit -m "Record forecasts as of ${as_of} [skip ci]"
          delays=(5 15 45)
          pushed=0
          for attempt in 1 2 3 4; do
            if ! git pull --rebase origin main; then
              git rebase --abort >/dev/null 2>&1 || true
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep "${delays[$((attempt - 1))]}"
            fi
          done
          if [ "$pushed" -ne 1 ]; then
            exit 1
          fi
      - name: Summarize the forecast ledger for the site
        if: steps.mode.outputs.full == 'true'
        run: python -m macro_event_lab ledger-summary --file ledger/forecast_ledger.jsonl --out "$MEL_DATA_DIR/web_public/ledger.json"
      - name: Check source freshness
        id: fresh
        if: steps.mode.outputs.full == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          report_file="${RUNNER_TEMP:-/tmp}/freshness_report.txt"
          set +e
          python -m macro_event_lab check-freshness --status "$MEL_DATA_DIR/web_public/status.json" > "$report_file" 2>&1
          status_code=$?
          set -e
          cat "$report_file"
          exit "$status_code"
      - name: Copy only the public files into the site
        if: steps.mode.outputs.full == 'true'
        run: |
          mkdir -p web/public/data
          cp "$MEL_DATA_DIR/web_public/revisions.json" "$MEL_DATA_DIR/web_public/nowcast.json" "$MEL_DATA_DIR/web_public/status.json" "$MEL_DATA_DIR/web_public/arena.json" "$MEL_DATA_DIR/web_public/briefing.json" "$MEL_DATA_DIR/web_public/ledger.json" "$MEL_DATA_DIR/web_public/calendar.ics" "$MEL_DATA_DIR/web_public/feed.xml" "$MEL_DATA_DIR/web_public/arena_forecasts.parquet" "$MEL_DATA_DIR/web_public/arena_scores.parquet" "$MEL_DATA_DIR/web_public/revisions.parquet" "$MEL_DATA_DIR/web_public/arena_forecasts.csv" "$MEL_DATA_DIR/web_public/arena_scores.csv" "$MEL_DATA_DIR/web_public/revisions.csv" web/public/data/
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          VITE_EDITION: public
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - name: Close resolved build issue
        if: success() && steps.fresh.outcome == 'success' && steps.ingest.outputs.spf_failed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          issue_number="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq '[.[] | select(.title == "Daily build problem")][0].number // ""')"
          if [ -n "$issue_number" ]; then
            gh issue close "$issue_number" --repo "$GH_REPO" --comment "Resolved: the latest build is fresh and complete."
          fi
      - name: Alert on daily build problem
        if: failure() || steps.fresh.outcome == 'failure' || steps.ingest.outputs.spf_failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FRESH_OUTCOME: ${{ steps.fresh.outcome }}
          SPF_FAILED: ${{ steps.ingest.outputs.spf_failed }}
        shell: bash
        run: |
          set -euo pipefail
          body="Daily build problem reported in run: $RUN_URL"
          if [ "$SPF_FAILED" = "true" ]; then
            body="${body}"$'\n\n'"Survey download failed in this run; the survey median is stale."
          fi
          report_file="${RUNNER_TEMP:-/tmp}/freshness_report.txt"
          if [ "$FRESH_OUTCOME" = "failure" ] && [ -s "$report_file" ]; then
            report_text="$(cat "$report_file")"
            body="${body}"$'\n\n'"${report_text}"
          fi
          issue_number="$(gh issue list --repo "$GH_REPO" --state open --limit 100 --json number,title --jq '[.[] | select(.title == "Daily build problem")][0].number // ""')"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --repo "$GH_REPO" --body "$body"
          else
            gh issue create --repo "$GH_REPO" --title "Daily build problem" --body "$body"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
